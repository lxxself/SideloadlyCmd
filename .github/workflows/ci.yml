name: macOS tests and distributions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install development build tools
        run: python -m pip install build
      - name: Regression tests (fixtures only)
        run: PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: CLI documentation drift
        run: python scripts/generate_cli_reference.py --check
      - name: Build standard packages
        run: python -m build
      - name: Build portable source runtime
        run: python scripts/build_portable.py
      - name: Documentation and archive boundaries
        run: python scripts/check_release.py
