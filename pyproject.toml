[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sideloadlycmd"
version = "1.0.0"
description = "Native macOS CLI IPA signing, installation and refresh using Xcode accounts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Operating System :: MacOS :: MacOS X", "Programming Language :: Python :: 3", "Topic :: Software Development :: Build Tools"]

[project.scripts]
sideloadlycmd = "sideloadlycmd.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sideloadlycmd = ["sideloadly.applescript"]
